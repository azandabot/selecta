name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Contract tests run nightly, not on pull requests. They assert the shape
    # of upstream APIs, which is the highest real risk in this project and the
    # one thing a contributor cannot fix in their own branch.
    - cron: "17 5 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -s sh bin/selecta lib/*.sh libexec/* statusline/*.sh \
            tests/run.sh tests/lib.sh tests/unit/*.sh tests/integration/*.sh
      - name: python compiles
        # compile(), not ast.parse(): ast.parse accepts "name used prior to
        # global declaration", which is a SyntaxError only at compile time.
        # That exact bug shipped and broke every YouTube playback.
        run: python3 -c "compile(open('libexec/selecta-httpd').read(), 'selecta-httpd', 'exec')"

      - name: json is well formed
        run: |
          sudo apt-get install -y -qq jq
          for f in .claude-plugin/*.json monitors/monitors.json data/*.json; do
            jq -e . "$f" >/dev/null || { echo "invalid: $f"; exit 1; }
          done
      - name: every mood references a real station
        run: |
          jq -sre '.[0].moods as $m | .[1].channels|map(.id) as $ids
            | [$m|to_entries[]|.value.stations[]]|unique
            | all(. as $s | $ids|index($s) != null)' \
            data/mood-map.json data/somafm-channels.seed.json
      - name: no ai attribution in tracked files
        # Excludes this file, which would otherwise match its own pattern and
        # fail every run.
        run: |
          ! git grep -niE 'co-authored-by|generated with' -- . ':!.github/workflows/ci.yml' || exit 1

  test:
    strategy:
      fail-fast: false
      matrix:
        # The platform split is where POSIX sh assumptions die. Both, always.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq mpv
          else
            brew install jq mpv
          fi
      - name: unit
        run: ./tests/run.sh unit
      - name: integration
        run: ./tests/run.sh integration

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: validate manifests
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate . --strict

  contract:
    # Upstream shape checks. Scheduled only: a provider outage must not redden
    # someone else's pull request.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - run: ./tests/run.sh contract
